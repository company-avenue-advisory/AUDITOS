databases:
  # Render-managed Postgres. DATABASE_URL below is wired automatically via
  # fromDatabase — no connection string to copy/paste anywhere.
  # "starter" is a legacy plan name, no longer valid for new Postgres
  # instances (confirmed via Render's Blueprint review error 2026-07-18) -
  # basic-256mb is the current smallest paid tier.
  - name: auditos-db
    plan: basic-256mb
    databaseName: auditos
    user: auditos

services:
  # 0. Render-managed Redis (Celery broker). CELERY_BROKER_URL below is
  # wired automatically via fromService — same reasoning as the DB above.
  # "redis" is a deprecated type alias; "keyvalue" is current (confirmed
  # via Render docs 2026-07-18).
  - type: keyvalue
    name: auditos-redis
    plan: starter
    ipAllowList: []

  # 1. Web Service (FastAPI Backend API)
  - type: web
    name: auditos-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter  # default starter tier (or standard depending on company choice)
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditos-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: auditos-redis
          property: connectionString
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCP_CREDS_JSON
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: MODEL_NAME
        sync: false

  # 2. Background Worker Service (Celery Worker Queue Processor)
  - type: worker
    name: auditos-worker
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter
    dockerCommand: celery -A celery_app worker --loglevel=info -Q celery,default,ocr,drive_sync
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditos-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: auditos-redis
          property: connectionString
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCP_CREDS_JSON
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: MODEL_NAME
        sync: false

  # 3. Celery Beat Scheduler — dispatches everything in beat_schedules.json
  # (monthly/daily sync jobs registered via scripts/setup_*.py) on its
  # crontab. Without this service running, beat_schedule entries are dead
  # config that never fires anything - confirmed missing from this file
  # before this change, meaning no scheduled sync had ever actually run
  # in production regardless of what was registered in beat_schedules.json.
  - type: worker
    name: auditos-beat
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter
    dockerCommand: celery -A celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditos-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: auditos-redis
          property: connectionString
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false

  # 4. Frontend (Next.js, standalone Docker build). NEXT_PUBLIC_API_URL is a
  # client-bundled env var (baked in at build time, not read at runtime), so
  # it's set to the backend's public Render URL directly rather than via
  # fromService (which resolves to an internal hostname meant for
  # service-to-service calls, not what a browser can reach) — Render's
  # public URL for a web service is always https://<name>.onrender.com,
  # so this is a deterministic, not-yet-deployed reference to auditos-backend.
  - type: web
    name: auditos-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: Dockerfile
    plan: starter
    dockerCommand: node server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://auditos-backend.onrender.com

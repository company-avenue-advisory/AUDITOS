services:
  # 1. Web Service (FastAPI Backend API)
  - type: web
    name: auditos-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter  # default starter tier (or standard depending on company choice)
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCP_CREDS_JSON
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: MODEL_NAME
        sync: false

  # 2. Background Worker Service (Celery Worker Queue Processor)
  - type: worker
    name: auditos-worker
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter
    dockerCommand: celery -A celery_app worker --loglevel=info -Q celery,default,ocr,drive_sync
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCP_CREDS_JSON
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: MODEL_NAME
        sync: false

  # 3. Celery Beat Scheduler — dispatches everything in beat_schedules.json
  # (monthly/daily sync jobs registered via scripts/setup_*.py) on its
  # crontab. Without this service running, beat_schedule entries are dead
  # config that never fires anything - confirmed missing from this file
  # before this change, meaning no scheduled sync had ever actually run
  # in production regardless of what was registered in beat_schedules.json.
  - type: worker
    name: auditos-beat
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter
    dockerCommand: celery -A celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false

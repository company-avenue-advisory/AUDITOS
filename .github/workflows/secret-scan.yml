name: Secret scan

# Defense-in-depth alongside GitHub's native secret scanning and the
# pre-commit gitleaks hook: catches anything committed by someone who
# skipped (or never installed) pre-commit, or a force-push that bypassed it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pinned to match the gitleaks version pre-commit runs locally
          # (.pre-commit-config.yaml, gitleaks/gitleaks rev v8.24.3) so a
          # finding can't differ between a local commit and the CI gate.
          GITLEAKS_VERSION: "8.24.3"

name: Secret scan

# Defense-in-depth alongside GitHub's native secret scanning and the
# pre-commit gitleaks hook: catches anything committed by someone who
# skipped (or never installed) pre-commit, or a force-push that bypassed it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs the free, open-source gitleaks CLI directly rather than
      # gitleaks/gitleaks-action@v2 - that wrapper now requires a paid
      # GITLEAKS_LICENSE for any GitHub organization repo (a breaking
      # change to the Action itself, not the underlying scanner), which
      # silently failed this check on every PR with no actual scan ever
      # running. The gitleaks binary itself remains fully free for
      # everyone; this just calls it without the paid wrapper.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      # Scoped to only the commits this push/PR actually introduces, not
      # gitleaks' default of full repo history. Full-history scanning
      # would permanently re-flag everything already in main's history
      # (confirmed: 191 pre-existing findings from before the 2026-09-16
      # data-cleanup pass) on every single future run forever, teaching
      # everyone to ignore a check that can never go green. A gitleaks
      # "baseline" file was considered instead, but its --baseline-path
      # matching depends on the plaintext secret value, not just a
      # fingerprint - committing one would mean re-publishing the exact
      # real GSTINs/names this cleanup just removed, just relocated into
      # a JSON file. Scoping the scan avoids the problem entirely: old,
      # already-handled history is simply never re-scanned.
      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.event.pull_request.base.ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            echo "range=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          else
            # New branch / no prior commit to diff against - fall back to
            # just the tip commit rather than the whole history.
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Run gitleaks
        run: ./gitleaks detect --source . --config .gitleaks.toml --log-opts="${{ steps.range.outputs.range }}" --redact --verbose

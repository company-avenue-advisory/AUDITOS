# Install once per clone:  pip install -r backend/requirements-dev.txt && pre-commit install
# Runs automatically on every `git commit` from then on -- no manual "remember to lint" step.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Auto-fixes what's safe to auto-fix (unused imports left alone --
      # see backend/pyproject.toml for why); catches real bugs (undefined
      # names, syntax errors) before they ever reach CI.
      - id: ruff
        args: ["--select", "E9,F63,F7,F82,F811,F821,F822", "--fix"]
        files: ^backend/
        exclude: ^backend/(backend - Copy)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

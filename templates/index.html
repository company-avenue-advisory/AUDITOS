<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Invoice Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="glass-container">
        <header>
            <h1>AI Invoice Extractor</h1>
            <p>Transform your PDF invoices into structured Excel sheets effortlessly.</p>
        </header>

        <section class="upload-section" id="drop-zone">
            <input type="file" id="file-input" multiple accept=".pdf" hidden>
            <div class="upload-content">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <h3 id="upload-text">Drag & drop your PDFs here</h3>
                <p>or click to browse</p>
            </div>
            <div id="file-list" class="file-list"></div>
        </section>

        <button id="extract-btn" class="primary-btn" disabled>
            <span class="btn-text">Extract to Excel</span>
            <span class="loader hidden"></span>
        </button>
        
        <div id="error-message" class="error-msg hidden"></div>
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const uploadText = document.getElementById('upload-text');
        const fileList = document.getElementById('file-list');
        const extractBtn = document.getElementById('extract-btn');
        const btnText = document.querySelector('.btn-text');
        const loader = document.querySelector('.loader');
        const errorMsg = document.getElementById('error-message');
        
        let selectedFiles = [];

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const pdfFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
            if (pdfFiles.length > 0) {
                selectedFiles = pdfFiles;
                updateFileList();
                extractBtn.disabled = false;
                errorMsg.classList.add('hidden');
            } else {
                showError("Please select valid PDF files.");
            }
        }

        function updateFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach(f => {
                const tag = document.createElement('span');
                tag.className = 'file-tag';
                tag.textContent = f.name;
                fileList.appendChild(tag);
            });
            uploadText.textContent = `${selectedFiles.length} file(s) selected`;
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
        }

        extractBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            // UI Loading state
            extractBtn.disabled = true;
            btnText.textContent = `Processing ${selectedFiles.length} file(s)... Please wait`;
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append("files", file);
            });

            // 10 min timeout for large batches on free tier
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 600000);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    const contentType = response.headers.get('content-type') || '';
                    if (contentType.includes('application/json')) {
                        // Server returned an error as JSON
                        const data = await response.json();
                        showError(data.error || "An error occurred during extraction.");
                        btnText.textContent = "Extract to Excel";
                    } else {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = "extracted_invoices.xlsx";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);
                        
                        btnText.textContent = "✓ Done! Extract more";
                        selectedFiles = [];
                        fileList.innerHTML = '';
                        uploadText.textContent = "Drag & drop your PDFs here";
                    }
                } else {
                    try {
                        const data = await response.json();
                        showError(data.error || "Extraction failed. Try uploading fewer files.");
                    } catch {
                        showError("Extraction failed. The API rate limit may have been reached. Wait 1 minute and try again.");
                    }
                    btnText.textContent = "Extract to Excel";
                }
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    showError("Request timed out. Try uploading fewer files (3-4 at a time).");
                } else {
                    showError("Network error. Could not connect to the server.");
                }
                btnText.textContent = "Extract to Excel";
            } finally {
                loader.classList.add('hidden');
                extractBtn.disabled = selectedFiles.length === 0;
            }
        });
    </script>
</body>
</html>

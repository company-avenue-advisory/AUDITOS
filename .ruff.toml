# Bootstrap Program 8 — minimal, default ruleset (pyflakes correctness checks
# + basic pycodestyle). Deliberately not opinionated/strict: the goal is
# catching real mistakes in new code (unused imports, undefined names, etc.),
# not enforcing a house style on a codebase that's never been linted before.
# CI only runs this against files a PR actually changes (see
# .github/workflows/ci.yml) — this config is scoped, not the gate itself.

target-version = "py312"
line-length = 120

[lint]
# Defaults (E4, E7, E9, F) — correctness-oriented, low noise. Revisit and
# tighten deliberately later; don't let stricter rules silently creep in.
ignore = [
    # E402 (module-level import not at top of file): this codebase's
    # established pattern for regression tests and main.py itself is
    # `sys.path.insert(...)` before local (bare-named) imports, so
    # `database`/`models`/`services.*` resolve correctly regardless of
    # invocation directory. That's a structural necessity here, not a
    # mistake — confirmed by checking main.py's own import block before
    # adding this exception, not assumed.
    "E402",
]

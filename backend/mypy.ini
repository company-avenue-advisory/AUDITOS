[mypy]
python_version = 3.12
explicit_package_bases = True
ignore_missing_imports = True
exclude = (?x)(
    ^backend\ -\ Copy/
    | ^\.venv/
  )

# The codebase currently has no type-hint coverage to speak of, so a strict
# run surfaces thousands of findings that are not a Phase 3B-sized fix. mypy
# is wired into CI as an advisory (non-blocking) job so type regressions are
# visible in the build log; tightening this file (check_untyped_defs,
# disallow_untyped_defs, etc.) is a follow-up once type hints are adopted
# incrementally.
check_untyped_defs = False
